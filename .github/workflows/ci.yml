name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: {otp-version: "28", elixir-version: "1.19"}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            native/*/target
          key: ${{ runner.os }}-${{ hashFiles('mix.lock', 'native/*/Cargo.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test
