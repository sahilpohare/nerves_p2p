[package]
name = "p2p_bridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "p2p_bridge"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.36.2"
libp2p = { version = "0.56", features = [
    "tokio",
    # Transports
    "tcp",
    "quic",
    "dns",
    # Security
    "noise",
    "tls",
    # Multiplexing
    "yamux",
    # Protocols
    "gossipsub",
    "kad",
    "mdns",
    "identify",
    "ping",
    "request-response",
    "cbor",
    "rendezvous",
    # NAT traversal
    "relay",
    "dcutr",
    "autonat",
    "upnp",
    # Resource management
    "macros",
    "metrics",
    "memory-connection-limits",
] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
thiserror = "2"
prometheus-client = "0.23"
rand = "0.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
type_complexity = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
