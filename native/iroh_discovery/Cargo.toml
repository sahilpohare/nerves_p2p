[package]
name = "iroh_discovery"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-lite = "2"
hex = "0.4"
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
iroh-mainline-address-lookup = "=0.5.0"
iroh-mdns-address-lookup = "=0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
